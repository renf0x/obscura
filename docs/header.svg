<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" role="img" aria-label="Obscura: self-hosted camera hub">
  <defs>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#34E3A4" opacity="0.035"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#34E3A4" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#34E3A4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34E3A4" stop-opacity="0"/>
      <stop offset="1" stop-color="#34E3A4" stop-opacity="0.12"/>
    </linearGradient>
  </defs>

  <rect width="960" height="260" rx="10" fill="#060A09"/>
  <rect width="960" height="260" rx="10" fill="url(#glow)"/>
  <rect width="960" height="260" rx="10" fill="url(#scan)"/>

  <!-- scan bar -->
  <rect x="0" y="-60" width="960" height="60" fill="url(#sweep)">
    <animate attributeName="y" values="-60;260" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- viewfinder corners -->
  <g stroke="#34E3A4" stroke-width="2" fill="none" opacity="0.8">
    <path d="M24 56 V24 H56"/>
    <path d="M904 24 H936 V56"/>
    <path d="M24 204 V236 H56"/>
    <path d="M904 236 H936 V204"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" fill="#8BA39C" font-size="13" letter-spacing="2">
    <circle cx="52" cy="46" r="6" fill="#FF5A5A">
      <animate attributeName="opacity" values="1;1;0.15;0.15" keyTimes="0;0.5;0.55;1" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <text x="66" y="51" fill="#FF5A5A">REC</text>
    <text x="906" y="51" text-anchor="end">CAM-01 · 1080P · 15 FPS</text>
    <text x="56" y="222">CASE FILE · SELF-HOSTED CAMERA HUB</text>
    <text x="906" y="222" text-anchor="end">CLEARANCE: OWNER ONLY</text>
  </g>

  <!-- crosshair -->
  <g stroke="#1B7A5A" stroke-width="1" opacity="0.7">
    <line x1="480" y1="70" x2="480" y2="84"/>
    <line x1="480" y1="176" x2="480" y2="190"/>
  </g>

  <text x="480" y="148" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace"
        font-size="64" font-weight="700" letter-spacing="22" fill="#E4F1EC">OBSCURA</text>
  <rect x="330" y="160" width="300" height="3" fill="#34E3A4"/>
</svg>
